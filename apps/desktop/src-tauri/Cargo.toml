[package]
name = "trademark-query-desktop"
version = "0.1.30"
description = "Local CNIPA trademark workbook query desktop application"
authors = ["Trademark Query Desktop"]
edition = "2024"

[lib]
name = "trademark_query_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-notification = "=2.3.3"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.23"
